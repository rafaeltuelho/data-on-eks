# Redpanda brokers: one dedicated node per broker (production docs), on-demand, single AZ
# (var.redpanda_zone: its secondary subnet is the range client networks route here). Uses the redpanda-broker-nvme
# EC2NodeClass so the local static provisioner exposes the instance store as `local-storage`.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: redpanda-broker
  namespace: karpenter
spec:
  template:
    metadata:
      labels:
        # Required so the local-static-provisioner DaemonSet runs on these nodes
        NodeGroupType: EphemeralStorageLocalProvisioner
        redpanda/role: broker
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: redpanda-broker-nvme
      # Dedicated to brokers: keeps other workloads off the broker nodes
      taints:
        - key: redpanda/dedicated
          value: broker
          effect: NoSchedule
      # Local NVMe data is lost if a node is replaced; never expire these nodes
      expireAfter: Never
      # Bounds the drain on cleanup (do-not-disrupt pods would otherwise block node deletion).
      # Must stay below the 300s nodepool-delete wait in infra/terraform/cleanup.sh.
      terminationGracePeriod: 4m
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["${REDPANDA_BROKER_INSTANCE_TYPE}"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["${REDPANDA_ZONE}"]
  # Room for the brokers plus one replacement node
  limits:
    cpu: "${REDPANDA_NODEPOOL_CPU_LIMIT}"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 600s
    budgets:
      - nodes: "0"
  weight: 1
