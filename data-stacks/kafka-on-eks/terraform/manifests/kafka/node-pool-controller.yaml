apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: controller
  namespace: kafka
  labels:
    strimzi.io/cluster: data-on-eks
spec:
  replicas: 3
  roles:
    - controller
  # Benchmark flavor: small dedicated KRaft controllers on m7g.large
  resources:
    requests:
      cpu: 250m
      memory: 1536Mi
    limits:
      memory: 2Gi
  jvmOptions:
    "-Xms": "768m"
    "-Xmx": "768m"
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        class: gp3
        size: 20Gi
        kraftMetadata: shared
        deleteClaim: true
  template:
    pod:
      metadata:
        annotations:
          karpenter.sh/do-not-disrupt: "true"
      tolerations:
        - key: benchmark/dedicated
          operator: Equal
          value: kafka-controller
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: karpenter.sh/nodepool
                    operator: In
                    values:
                      - kafka-benchmark-controller
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: strimzi.io/pool-name
                    operator: In
                    values:
                      - controller
              topologyKey: kubernetes.io/hostname
