apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: broker
  namespace: kafka
  labels:
    strimzi.io/cluster: data-on-eks
spec:
  replicas: 3
  roles:
    - broker
  # Benchmark flavor: one broker per m7gd.large, mirroring Redpanda BYOC Tier 1
  resources:
    requests:
      cpu: "1"
      memory: 5Gi
    # No limits: like Redpanda, the broker may use the whole node (CPU and page cache)
  jvmOptions:
    "-Xms": "2g"
    "-Xmx": "2g"
  storage:
    type: jbod
    volumes:
      # Local NVMe instance store (118 GB on m7gd.large) via local-static-provisioner
      - id: 0
        type: persistent-claim
        class: local-storage
        size: 100Gi
        kraftMetadata: shared
        deleteClaim: true
  template:
    pod:
      metadata:
        annotations:
          # Local NVMe data is lost on node replacement; block voluntary disruption
          karpenter.sh/do-not-disrupt: "true"
      tolerations:
        - key: benchmark/dedicated
          operator: Equal
          value: kafka-broker
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: karpenter.sh/nodepool
                    operator: In
                    values:
                      - kafka-benchmark-broker
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: strimzi.io/pool-name
                    operator: In
                    values:
                      - broker
              topologyKey: kubernetes.io/hostname
