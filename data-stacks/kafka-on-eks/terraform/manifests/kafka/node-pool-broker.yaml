apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  namespace: kafka
  labels:
    strimzi.io/cluster: data-on-eks
spec:
  replicas: 3
  roles:
    - broker
  # Benchmark flavor: one broker per node (var.benchmark_broker_instance_type), mirroring Redpanda BYOC Tier 1
  resources:
    requests:
      cpu: "1"
      memory: 5Gi
    # No limits: like Redpanda, the broker may use the whole node (CPU and page cache)
  jvmOptions:
    "-Xms": "2g"
    "-Xmx": "2g"
  storage:
    type: jbod
    volumes:
      # Local NVMe instance store (118 GB on m7gd.large; keep size below the device) via local-static-provisioner
      - id: 0
        type: persistent-claim
        class: local-storage
        size: 100Gi
        kraftMetadata: shared
        deleteClaim: true
  template:
    # Per-broker NLBs for the `external` listener (same settings as the bootstrap NLB in
    # kafka-cluster.yaml). Must live here: with node pools, the Kafka CR perPodService is ignored.
    perPodService:
      metadata:
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-scheme: internal
          service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
          service.beta.kubernetes.io/aws-load-balancer-subnets: ${BENCHMARK_NLB_SUBNET_NAME}
          service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=false
    pod:
      metadata:
        annotations:
          # Local NVMe data is lost on node replacement; block voluntary disruption
          karpenter.sh/do-not-disrupt: "true"
      tolerations:
        - key: benchmark/dedicated
          operator: Equal
          value: kafka-broker
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: karpenter.sh/nodepool
                    operator: In
                    values:
                      - kafka-benchmark-broker
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: strimzi.io/pool-name
                    operator: In
                    values:
                      - broker
              topologyKey: kubernetes.io/hostname
