# Applied by Terraform (kafka.tf) as a template: $${VAR} placeholders come from
# local.benchmark_template_vars (benchmark-variables.tf / data-stack.tfvars).
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: data-on-eks
  namespace: kafka
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: 3.9.0
    metadataVersion: 3.9-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
      # Benchmark flavor: internal NLBs (1 bootstrap + 1 per broker) for the benchmark
      # clients in the peered VPC (var.benchmark_peer_vpc_id).
      # TLS + SCRAM to match Redpanda BYOC (Strimzi supports SCRAM-SHA-512 only).
      # Clients trust the cluster CA from secret data-on-eks-cluster-ca-cert.
      - name: external
        port: 9094
        type: loadbalancer
        tls: true
        authentication:
          type: scram-sha-512
        configuration:
          class: service.k8s.aws/nlb   # sets Service loadBalancerClass -> AWS Load Balancer Controller
          # Peer (client) VPC CIDR, or this VPC's CIDR when peering is disabled
          loadBalancerSourceRanges: ${BENCHMARK_CLIENT_CIDRS_JSON}
    # ACLs are enforced (see ../benchmark/kafka-user.yaml). ANONYMOUS is a super user so the
    # unauthenticated in-cluster `plain`/`tls` listeners keep working (helper.sh, examples).
    authorization:
      type: simple
      superUsers:
        - ANONYMOUS
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
    # Benchmark flavor (Redpanda BYOC Tier 1): resources, JVM options, storage and
    # scheduling are defined per KafkaNodePool in node-pool-*.yaml (same directory).
    template:
      # NLB settings for the `external` listener services. NLBs go in the benchmark AZ's
      # secondary subnet: the only range routed from the worker VPC, whose 10.0.0.0/16
      # route may already point at the Redpanda BYOC VPC (see vpc-peering-benchmark.tf).
      externalBootstrapService:
        metadata:
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-scheme: internal
            service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
            service.beta.kubernetes.io/aws-load-balancer-subnets: ${BENCHMARK_NLB_SUBNET_NAME}
            service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=false
      # Per-broker NLB services are configured in node-pool-broker.yaml
      # (template.perPodService): with node pools, Strimzi ignores perPodService here.
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
    # rack awareness removed: all brokers run in a single AZ (var.benchmark_zone), like the Redpanda BYOC cluster
  entityOperator:
    topicOperator: {}
    userOperator: {}
  cruiseControl: {}
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
