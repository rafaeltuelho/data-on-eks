# KRaft controllers for the Redpanda BYOC Tier 1 benchmark (default m7g.large: m7g.medium caps at 8 pods,
# which DaemonSets alone nearly fill).
# Redpanda has no separate metadata nodes, so controllers run on small dedicated
# nodes and brokers keep their whole node. Report these 3 nodes as Kafka overhead.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: kafka-benchmark-controller
  namespace: karpenter
spec:
  template:
    metadata:
      labels:
        benchmark/role: kafka-controller
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      taints:
        - key: benchmark/dedicated
          value: kafka-controller
          effect: NoSchedule
      expireAfter: Never
      # Bounds the drain on cleanup (do-not-disrupt pods would otherwise block node deletion).
      # Must stay below the 300s nodepool-delete wait in infra/terraform/cleanup.sh.
      terminationGracePeriod: 4m
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["${BENCHMARK_CONTROLLER_INSTANCE_TYPE}"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["${BENCHMARK_ZONE}"]
  limits:
    cpu: "8"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 600s
    budgets:
      - nodes: "0"
  weight: 1
