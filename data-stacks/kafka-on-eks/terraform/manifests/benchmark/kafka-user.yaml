# Benchmark user for the `external` (TLS + SCRAM-SHA-512) listener, mirroring the
# Redpanda BYOC `admin` user ACLs. Applied by kafka-benchmark-user.tf when
# TF_VAR_benchmark_kafka_admin_password is set; the password lives in Secret
# <username>-password, which Terraform creates from that variable (never in git).
# Redpanda's Subject / Schema Registry ACLs have no Kafka equivalent (no Schema Registry here).
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: ${USERNAME}
  namespace: kafka
  labels:
    strimzi.io/cluster: data-on-eks
spec:
  authentication:
    type: scram-sha-512
    password:
      valueFrom:
        secretKeyRef:
          name: ${PASSWORD_SECRET_NAME}
          key: password
  authorization:
    type: simple
    acls:
      - resource:
          type: cluster
        operations:
          - All
        host: "*"
      - resource:
          type: group
          name: "*"
          patternType: literal
        operations:
          - All
        host: "*"
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations:
          - All
        host: "*"
      - resource:
          type: transactionalId
          name: "*"
          patternType: literal
        operations:
          - All
        host: "*"
