apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-kafka-operator
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: quay.io
      chart: strimzi-helm/strimzi-kafka-operator
      targetRevision: 1.2.0 # benchmark flavor: overrides base 0.47.0 (Kafka 4.3.x, kafka.strimzi.io/v1 API)
      helm:
        releaseName: strimzi-kafka-operator
        values: |
          ${user_values_yaml}
  destination:
    server: https://kubernetes.default.svc
    namespace: strimzi-system
  enableOCI: true
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
