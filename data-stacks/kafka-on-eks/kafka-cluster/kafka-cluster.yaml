apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: data-on-eks
  namespace: kafka
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: 3.9.0
    metadataVersion: 3.9-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
    # Benchmark flavor (Redpanda BYOC Tier 1): resources, JVM options, storage and
    # scheduling are defined per KafkaNodePool in terraform/manifests/kafka/node-pool-*.yaml.
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
    # rack awareness removed: all brokers run in a single AZ (us-east-2a), like the Redpanda BYOC cluster
  entityOperator:
    topicOperator: {}
    userOperator: {}
  cruiseControl: {}
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
