apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: data-on-eks
  namespace: kafka
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: 3.9.0
    metadataVersion: 3.9-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
      # Benchmark flavor: internal NLBs (1 bootstrap + 1 per broker) for the benchmark
      # workers in the peered VPC vpc-031a34d4639335164 (10.100.0.0/16).
      # TLS + SCRAM to match Redpanda BYOC (Strimzi supports SCRAM-SHA-512 only).
      # Clients trust the cluster CA from secret data-on-eks-cluster-ca-cert.
      - name: external
        port: 9094
        type: loadbalancer
        tls: true
        authentication:
          type: scram-sha-512
        configuration:
          class: service.k8s.aws/nlb   # sets Service loadBalancerClass -> AWS Load Balancer Controller
          loadBalancerSourceRanges:
            - 10.100.0.0/16
    # ACLs are enforced (see kafka-user-admin.yaml). ANONYMOUS is a super user so the
    # unauthenticated in-cluster `plain`/`tls` listeners keep working (helper.sh, examples).
    authorization:
      type: simple
      superUsers:
        - ANONYMOUS
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
    # Benchmark flavor (Redpanda BYOC Tier 1): resources, JVM options, storage and
    # scheduling are defined per KafkaNodePool in terraform/manifests/kafka/node-pool-*.yaml.
    template:
      # NLB settings for the `external` listener services. NLBs go in the us-east-2a
      # secondary subnet (100.64.0.0/16): the only range routed from the worker VPC,
      # whose 10.0.0.0/16 route already points at the Redpanda BYOC VPC.
      externalBootstrapService:
        metadata:
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-scheme: internal
            service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
            service.beta.kubernetes.io/aws-load-balancer-subnets: kafka-on-eks-private-secondary1-us-east-2a
            service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=false
      perPodService:
        metadata:
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-scheme: internal
            service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
            service.beta.kubernetes.io/aws-load-balancer-subnets: kafka-on-eks-private-secondary1-us-east-2a
            service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=false
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
    # rack awareness removed: all brokers run in a single AZ (us-east-2a), like the Redpanda BYOC cluster
  entityOperator:
    topicOperator: {}
    userOperator: {}
  cruiseControl: {}
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
