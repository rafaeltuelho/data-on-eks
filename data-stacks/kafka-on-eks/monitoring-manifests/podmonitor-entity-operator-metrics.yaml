apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: entity-operator-metrics
  namespace: kafka
  labels:
    app: strimzi
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: entity-operator
  namespaceSelector:
    matchNames:
      - kafka
  podMetricsEndpoints:
  # Strimzi >= 1.1.0 renamed the entity-operator ports: healthcheck-to (topic operator)
  # and healthcheck-uo (user operator)
  - path: /metrics
    port: healthcheck-to
  - path: /metrics
    port: healthcheck-uo
